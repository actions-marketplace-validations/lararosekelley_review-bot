name: Release

# A pushed vX.Y.Z tag publishes a GitHub release with that version's notes from
# CHANGELOG.md. The moving major tag (v1) does not match and publishes nothing.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
