# Full control: own the triggers, gating, and permissions yourself and call the
# action directly. Use this shape when you need branch filters, a different
# event set, or extra steps in the job.
name: "Code Review Bot"

on:
  pull_request:
    types: [opened, ready_for_review]
    # e.g. skip the synthetic bases a stacking tool pushes
    branches-ignore:
      - "graphite-base/**"
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@bot')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@bot review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: lararosekelley/review-bot@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-5
          effort: ""
          bot-name: "The Enforcer"
          repo-notes-file: .github/review-bot/REPO_NOTES.md
